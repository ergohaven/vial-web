name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v4

    - name: Cache emsdk
      uses: actions/cache@v4
      with:
        path: emsdk
        key: emsdk-3.1.10

    - name: Cache deps sources
      uses: actions/cache@v4
      with:
        path: sources
        key: vial-deps-v1

    - name: Cache built deps
      uses: actions/cache@v4
      with:
        path: deps
        key: vial-deps-built-v1-${{ runner.os }}

    - name: Clone ergohaven/vial-gui
      run: git clone https://github.com/ergohaven/vial-gui.git

    - name: Clone via-keymap-precompiled
      run: git clone https://github.com/vial-kb/via-keymap-precompiled.git

    - name: Fetch emsdk
      run: |
        if [ ! -f emsdk/emsdk ]; then
          ./fetch-emsdk.sh
        else
          cd emsdk && ./emsdk activate 3.1.10
        fi

    - name: Fetch deps
      run: ./fetch-deps.sh

    - name: Build deps
      run: ./build-deps.sh

    - name: Build
      run: cd src && ./build.sh

    - name: Setup Pages
      if: github.ref == 'refs/heads/main'
      uses: actions/configure-pages@v4

    - name: Upload Pages artifact
      if: github.ref == 'refs/heads/main'
      uses: actions/upload-pages-artifact@v3
      with:
        path: src/build

  deploy:
    needs: build
    runs-on: ubuntu-22.04
    if: github.ref == 'refs/heads/main'

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4
